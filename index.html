<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESTÂNCIA 78 – Gestão Rural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --verde:#1f3d2b; --verde2:#2a5139; --verde3:#16301f; --oliva:#6b7a3a; --oliva2:#8a9a52;
  --ouro:#c9a54a; --ouro2:#e2c77a; --branco:#fff; --cinza:#f3f4f0; --cinza2:#e6e8e1; --cinza3:#c9ccc2;
  --tx:#1d2420; --tx2:#4d5650; --tx3:#7b847e;
  --ok:#1a7f4b; --erro:#c4462e; --alerta:#a8780a; --info:#2d6cc8;
  --c-bov:#1a7f4b; --c-sui:#c4462e; --c-gal:#2d6cc8; --c-ger:#a8780a;
  --r:10px; --sh:0 1px 2px rgba(20,40,25,.06),0 4px 14px rgba(20,40,25,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--tx);background:var(--cinza);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.02em;margin:0}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* Sidebar */
.side{background:linear-gradient(180deg,var(--verde) 0%,var(--verde3) 100%);color:#e8efe9;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand svg{width:46px;height:46px;flex:none}
.brand .t1{font-family:"Barlow Condensed";font-weight:700;font-size:23px;letter-spacing:.06em;color:#fff;line-height:1}
.brand .t2{font-size:10.5px;letter-spacing:.32em;color:var(--ouro2);margin-top:4px;font-weight:600}
.menu{padding:10px 10px 20px;flex:1}
.menu a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#cfdcd2;text-decoration:none;font-weight:500;margin:1px 0;font-size:13.5px}
.menu a svg{width:18px;height:18px;flex:none;opacity:.85}
.menu a:hover{background:rgba(255,255,255,.06);color:#fff}
.menu a.on{background:rgba(201,165,74,.16);color:#fff;box-shadow:inset 3px 0 0 var(--ouro)}
.menu a .tag{margin-left:auto;font-size:9.5px;letter-spacing:.06em;background:rgba(255,255,255,.08);color:#b9c7bc;padding:2px 6px;border-radius:20px;font-weight:600}
.menu .sep{font-size:10px;letter-spacing:.2em;color:#87a08c;padding:14px 12px 4px;font-weight:600}
.side .foot{padding:14px 18px;font-size:11px;color:#8fa695;border-top:1px solid rgba(255,255,255,.08)}
.side .foot b{color:var(--ouro2);font-weight:600}
/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--cinza2);display:flex;align-items:center;gap:12px;padding:12px 26px;position:sticky;top:0;z-index:20;padding-top:max(12px,env(safe-area-inset-top))}
.top h1{font-size:24px;color:var(--verde);font-weight:700}
.top .sub{color:var(--tx3);font-size:12px;margin-top:1px}
.top .usr{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12.5px}
.top .usr .av{width:30px;height:30px;border-radius:50%;background:var(--oliva);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.burger{display:none;background:none;border:0;padding:6px;color:var(--verde);cursor:pointer}
.content{padding:22px 26px 60px;max-width:1500px;width:100%}
.dbstate{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--cinza);color:var(--tx3)}
.dbstate.ok{background:#e4f2e9;color:var(--ok)}
.dbstate.warn{background:#fbf0d9;color:#7a5800}
/* Cards & grid */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--cinza2);padding:16px 18px;min-width:0}
.card h3{font-size:17px;color:var(--verde);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .hint{font-family:Inter;font-size:11.5px;color:var(--tx3);font-weight:400;letter-spacing:0;margin-left:auto}
.kpi{background:#fff;border-radius:var(--r);border:1px solid var(--cinza2);box-shadow:var(--sh);padding:13px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--oliva)}
.kpi.gold::before{background:var(--ouro)} .kpi.green::before{background:var(--ok)} .kpi.red::before{background:var(--erro)} .kpi.blue::before{background:var(--info)}
.kpi .l{font-size:11.5px;color:var(--tx3);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:"Barlow Condensed";font-size:26px;font-weight:700;color:var(--tx);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--tx3);margin-top:1px}
.pos{color:var(--ok)!important} .neg{color:var(--erro)!important}
.section-t{font-size:13px;letter-spacing:.14em;color:var(--oliva);font-weight:700;margin:22px 0 10px;font-family:Inter;text-transform:uppercase}
/* Toolbar / filters */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:14px}
.bar .grow{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11.5px;color:var(--tx2);font-weight:500}
.fld input,.fld select,.fld textarea,.bar input,.bar select{border:1px solid var(--cinza3);border-radius:8px;padding:8px 10px;background:#fff;color:var(--tx);min-width:0;width:100%}
.bar .fld{width:auto}
.bar .fld input,.bar .fld select{width:auto;min-width:120px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid rgba(107,122,58,.35);border-color:var(--oliva)}
.fld textarea{min-height:64px;resize:vertical}
.fld input[readonly]{background:var(--cinza);font-weight:600}
.btn{border:1px solid transparent;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;line-height:1.2}
.btn.primary{background:var(--verde);color:#fff}
.btn.primary:hover{background:var(--verde2)}
.btn.gold{background:var(--ouro);color:var(--verde3)}
.btn.ghost{background:#fff;border-color:var(--cinza3);color:var(--tx)}
.btn.ghost:hover{border-color:var(--oliva)}
.btn.danger{background:#fff;border-color:#e5b5aa;color:var(--erro)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--cinza3);background:#fff;border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--tx2);font-weight:500}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--cinza2);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--tx2);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:13.5px}
.tabs a.on{color:var(--verde);border-color:var(--ouro)}
/* Tables */
.tw{overflow-x:auto;background:#fff;border-radius:var(--r);border:1px solid var(--cinza2);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--cinza2);background:#fafbf8;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #f0f1ec;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbf7}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:#fafbf8;border-top:1px solid var(--cinza2)}
.empty{padding:34px;text-align:center;color:var(--tx3)}
.empty b{display:block;color:var(--tx2);font-size:15px;margin-bottom:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:#e4f2e9;color:#15663c}.b-pend{background:#fbf0d9;color:#7a5800}.b-err{background:#f9e3de;color:#a33a24}.b-par{background:#e3ecf8;color:#24589f}.b-mut{background:var(--cinza);color:var(--tx2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.acts{display:flex;gap:4px;justify-content:flex-end}
.ico{background:none;border:1px solid transparent;border-radius:6px;padding:4px 6px;cursor:pointer;color:var(--tx2);font-size:12px;font-weight:600}
.ico:hover{background:var(--cinza);border-color:var(--cinza2)}
.muted{color:var(--tx3)} .small{font-size:12px}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:220px}
/* Modal */
.mback{position:fixed;inset:0;background:rgba(15,30,20,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:4vh 12px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin-bottom:4vh}
.modal.wide{max-width:900px}
.modal header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--cinza2);background:linear-gradient(90deg,#fff,#f8f9f4);border-radius:14px 14px 0 0}
.modal header h3{font-size:21px;color:var(--verde)}
.modal header .x{margin-left:auto;background:none;border:0;font-size:24px;cursor:pointer;color:var(--tx3);line-height:1}
.mbody{padding:18px 20px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--cinza2)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg .full{grid-column:1/-1}
.fg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ferr{background:#f9e3de;color:#8e2f1c;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-weight:500}
.note{background:#f4f6ec;border:1px solid #e1e6cc;color:#4d5a24;border-radius:8px;padding:9px 12px;font-size:12.5px}
.calc{background:var(--verde);color:#fff;border-radius:10px;padding:12px 16px;display:flex;gap:22px;flex-wrap:wrap}
.calc div{display:flex;flex-direction:column}
.calc span{font-size:11px;color:#b9cdbf;text-transform:uppercase;letter-spacing:.06em}
.calc b{font-family:"Barlow Condensed";font-size:22px}
.checklist{max-height:240px;overflow-y:auto;border:1px solid var(--cinza3);border-radius:8px;padding:6px}
.checklist label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer}
.checklist label:hover{background:var(--cinza)}
.toggle{display:flex;border:1px solid var(--cinza3);border-radius:8px;overflow:hidden}
.toggle label{flex:1;text-align:center;padding:8px;cursor:pointer;font-weight:600;color:var(--tx2)}
.toggle input{display:none}
.toggle input:checked+span{color:#fff}
.toggle label:has(input:checked){background:var(--verde);color:#fff}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;margin-bottom:16px}
.dl div span{display:block;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.dl div b{font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--verde);color:#fff;padding:11px 18px;border-radius:10px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500;border-left:4px solid var(--ouro)}
.toast.err{background:#7d2716}
.plan{max-width:760px}
.plan ul{margin:8px 0 0;padding-left:18px;color:var(--tx2);line-height:1.7}
.splash{position:fixed;inset:0;background:var(--verde);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:300;gap:14px;text-align:center;padding:20px}
.splash svg{width:96px;height:96px}
.splash .t1{font-family:"Barlow Condensed";font-size:40px;font-weight:700;letter-spacing:.08em}
.splash .t2{letter-spacing:.4em;color:var(--ouro2);font-size:13px;font-weight:600}
.splash .t3{color:#b9cdbf;font-style:italic;margin-top:6px}
.splash .msg{margin-top:16px;color:#d8e4da;max-width:420px;line-height:1.5}
.alerts{display:flex;flex-direction:column;gap:6px}
.alerts div{padding:8px 12px;border-radius:8px;font-size:12.5px;background:#fbf0d9;color:#6b4e00}
.alerts div.err{background:#f9e3de;color:#8e2f1c}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:6px}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .burger{display:block}
  .top{padding:10px 14px}
  .top h1{font-size:21px}
  .top .usr .nm{display:none}
  .content{padding:14px 12px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fg,.fg3{grid-template-columns:1fr}
  .dl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:22px}
  .bar .fld input,.bar .fld select{min-width:0}
  .bar .fld{flex:1 1 140px}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none}
.scrim.on{display:block}
</style>
</head>
<body>
<div class="splash" id="splash">
  <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="Estância 78"><path d="M32 3.5 55.5 11v19.5C55.5 46 45 56.5 32 60.5 19 56.5 8.5 46 8.5 30.5V11Z" fill="#1f3d2b" stroke="#c9a54a" stroke-width="2.4"/><path d="M14.5 15.5c1.4 5.6 5.6 8.6 11 8.9l-1.2 3.4c-6.4-.8-10.6-5.6-9.8-12.3Z" fill="#c9a54a"/><path d="M49.5 15.5c-1.4 5.6-5.6 8.6-11 8.9l1.2 3.4c6.4-.8 10.6-5.6 9.8-12.3Z" fill="#c9a54a"/><path d="M23.5 24.5h17c.8 0 1.4.7 1.3 1.5l-1.6 7.5c-.3 1.5-1 2.8-2 3.9L34.4 41c-1.3 1.4-3.5 1.4-4.8 0l-3.8-3.6c-1-1.1-1.7-2.4-2-3.9L22.2 26c-.1-.8.5-1.5 1.3-1.5Z" fill="none" stroke="#e2c77a" stroke-width="1.6"/><text x="32" y="53.5" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="14" fill="#fff" letter-spacing="1">78</text><path d="M17 47.5h6M41 47.5h6" stroke="#8a9a52" stroke-width="1.4" stroke-linecap="round"/></svg>
  <div><div class="t1">ESTÂNCIA 78</div><div class="t2">GESTÃO RURAL</div><div class="t3">Dados. Manejo. Resultado.</div></div>

</div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="Estância 78"><path d="M32 3.5 55.5 11v19.5C55.5 46 45 56.5 32 60.5 19 56.5 8.5 46 8.5 30.5V11Z" fill="#1f3d2b" stroke="#c9a54a" stroke-width="2.4"/><path d="M14.5 15.5c1.4 5.6 5.6 8.6 11 8.9l-1.2 3.4c-6.4-.8-10.6-5.6-9.8-12.3Z" fill="#c9a54a"/><path d="M49.5 15.5c-1.4 5.6-5.6 8.6-11 8.9l1.2 3.4c6.4-.8 10.6-5.6 9.8-12.3Z" fill="#c9a54a"/><path d="M23.5 24.5h17c.8 0 1.4.7 1.3 1.5l-1.6 7.5c-.3 1.5-1 2.8-2 3.9L34.4 41c-1.3 1.4-3.5 1.4-4.8 0l-3.8-3.6c-1-1.1-1.7-2.4-2-3.9L22.2 26c-.1-.8.5-1.5 1.3-1.5Z" fill="none" stroke="#e2c77a" stroke-width="1.6"/><text x="32" y="53.5" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="14" fill="#fff" letter-spacing="1">78</text><path d="M17 47.5h6M41 47.5h6" stroke="#8a9a52" stroke-width="1.4" stroke-linecap="round"/></svg><div><div class="t1">ESTÂNCIA 78</div><div class="t2">GESTÃO RURAL</div></div></div>
    <nav class="menu" id="menu"></nav>
    <div class="foot"><b>Dados. Manejo. Resultado.</b><br><span id="foot-ver">Etapa 1</span></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div><h1 id="ptitle">Dashboard</h1><div class="sub" id="psub"></div></div>
      <div class="usr"><span class="dbstate" id="dbstate">conectando…</span><span class="nm" id="uname"></span><div class="av" id="uav">E</div></div>

<script>
'use strict';
/* =====================================================================
   ESTÂNCIA 78 – GESTÃO RURAL · núcleo
   Banco: coleções no db do Claude (somente proprietário/editores)
     lancamentos · contas · animais · lotes · movimentacoes · ovos · auditoria · config/geral
   ===================================================================== */

/* ---------- Constantes de domínio ---------- */
const ESPECIES = {
  bovino:  { nome:'Bovinos',  sing:'Bovino',  atividade:'bovinos',  cor:'var(--c-bov)' },
  suino:   { nome:'Suínos',   sing:'Suíno',   atividade:'suinos',   cor:'var(--c-sui)' },
  galinha: { nome:'Galinhas', sing:'Galinha', atividade:'galinhas', cor:'var(--c-gal)' }
};
const ATIVIDADES = { bovinos:'Bovinos', suinos:'Suínos', galinhas:'Galinhas', geral:'Despesas Gerais' };
const ATV_ESPECIE = { bovinos:'bovino', suinos:'suino', galinhas:'galinha' };
const CORES = { bovinos:'#1a7f4b', suinos:'#c4462e', galinhas:'#2d6cc8', geral:'#a8780a', receita:'#1a7f4b', despesa:'#c4462e', neutro:'#6b7a3a' };

const CLASSIF = {
  operacional:'Despesa operacional',
  geral:'Despesa geral',
  investimento:'Investimento em infraestrutura',
  patrimonio:'Aquisição de patrimônio',
  manutencao:'Manutenção e conservação'
};
const CLASSIF_ECON = ['operacional','geral','manutencao'];   // entram no resultado econômico
const CLASSIF_INV  = ['investimento','patrimonio'];          // tratados como investimento

const CAT_RECEITA = {
  bovinos:['Venda de bovinos','Outras receitas'],
  suinos:['Venda de suínos','Venda de leitões','Venda de leitões desmamados','Venda de porcos inteiros','Venda de matrizes/reprodutores','Venda de esterco','Outras receitas da suinocultura'],
  galinhas:['Venda de galinhas','Venda de ovos','Venda de esterco','Outras receitas'],
  geral:['Venda de outros produtos','Venda de esterco','Outras receitas']
};
const CAT_DESP_ANIMAL = ['Ração','Milho','Sal mineral','Suplementos','Medicamentos','Vacinas','Vermífugos','Alimentação','Mão de obra','Combustível','Transporte','Manutenção operacional','Outros custos'];

function num(v){
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).trim().replace(/R\$\s?/,'').replace(/\s/g,'');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}

function addMeses(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m-1+n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate();
  t.setUTCDate(Math.min(d,last)); return t.toISOString().slice(0,10);
}

async function waitClaude(ms=10000){
  const t0 = Date.now();
  while (!(window.claude && typeof window.claude.use === 'function')) {
    if (Date.now()-t0 > ms) return null;
    await new Promise(r => setTimeout(r, 100));
  }
  return window.claude;
}
function colRef(c){ return S.db.collection(c); }
function stamp(){ return new Date().toISOString(); }
function novoId(c){ return colRef(c).doc().id; }

async function dbSet(c, id, data){
  const body = { ...data, excluido:false, criadoEm:stamp(), criadoPor:S.uid||null, atualizadoEm:stamp() };
  await retry(() => colRef(c).doc(id).set(clean(body)));
  return id;
}
async function dbUpd(c, id, data){
  await retry(() => colRef(c).doc(id).update(clean({ ...data, atualizadoEm:stamp(), atualizadoPor:S.uid||null })));
}
function clean(o){ // remove undefined (JSON puro)
  return JSON.parse(JSON.stringify(o, (k,v) => v === undefined ? null : v));
}
async function retry(fn){
  try { return await fn(); }
  catch(e){
    if (e && e.code === 'unavailable') { await new Promise(r=>setTimeout(r, 400+Math.random()*600)); return await fn(); }
    throw traduzErro(e);
  }
}
function traduzErro(e){
  const c = e && e.code;
  const m = {
    invalid_argument:'O banco recusou a gravação (sem permissão de edição ou dado inválido).',
    quota_exceeded:'O limite de armazenamento do banco foi atingido. Exporte um backup e remova registros antigos.',
    resource_exhausted:'Muitas operações seguidas. Aguarde alguns segundos e tente de novo.',
    revoked:'O acesso a este sistema foi alterado. Recarregue a página.',
    unavailable:'Banco temporariamente indisponível. Tente novamente.'
  }[c];
  const err = new Error(m || (e && e.message) || String(e)); err.code = c; return err;
}

async function initDB(){
  const claude = await waitClaude();
  if (!claude) return semBanco('Abra este sistema pelo Claude (navegador ou app) com a sua conta para acessar o banco de dados.');
  S.db = await claude.use('db');
  S.user = await claude.use('user');
  claude.use('downloads').then(d => S.downloads = d).catch(()=>{});
  if (!S.db) return semBanco('Entre na sua conta do Claude para acessar o banco de dados da Estância 78.');
  if (S.user) {
    try { S.uid = await S.user.id(); const me = await S.user.me(); S.nome = (me && me.name) || ''; } catch(e){}
    try { const w = await S.user.can('data.write'); if (w === false) S.podeEscrever = false; } catch(e){}
  }
  $('#uname').textContent = S.nome || 'Proprietário';
  $('#uav').textContent = (S.nome || 'E').trim().charAt(0).toUpperCase();
  let timer = setTimeout(() => setDbState('warn','sem resposta do banco'), 10000);
  const pend = new Set([...COLS, 'config', 'auditoria']);
  const done = (k, fromCache) => { if (!fromCache) { pend.delete(k); S.loaded.add(k); } if (!pend.size) { clearTimeout(timer); setDbState('ok','sincronizado'); } hideSplash(); scheduleRender(); };
  for (const c of COLS) {
    colRef(c).onSnapshot(snap => {
      S.data[c] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      done(c, snap.metadata && snap.metadata.fromCache);
    }, err => { clearTimeout(timer); setDbState('warn','erro: '+(err.code||'')); console.error(c, err); hideSplash(); });
  }
  colRef('auditoria').orderBy('quando','desc').limit(300).onSnapshot(snap => {
    S.data.auditoria = snap.docs.map(d => ({ id:d.id, ...d.data() })); done('auditoria', snap.metadata && snap.metadata.fromCache);
  }, err => console.error('auditoria', err));
  S.db.doc('config/geral').onSnapshot(snap => {
    S.cfgExiste = !!snap.exists;
    const d = snap.exists ? snap.data() : {};
    S.cfg = { ...JSON.parse(JSON.stringify(CFG_PADRAO)), ...d, catAnimalExtra:{ ...CFG_PADRAO.catAnimalExtra, ...(d.catAnimalExtra||{}) }, valorEstimado:{ ...CFG_PADRAO.valorEstimado, ...(d.valorEstimado||{}) } };
    done('config', snap.metadata && snap.metadata.fromCache);
  }, err => console.error('config', err));
  setTimeout(hideSplash, 2500);
}

/* ---------- Modal / diálogos / toast ---------- */
function modal({ title, html, submit='Salvar', onSubmit, onInit, wide=false, extraFooter='' }){
  const id = 'm'+uid();
  $('#modal-root').insertAdjacentHTML('beforeend',
    `<div class="mback" id="${id}"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">
      <header><h3>${esc(title)}</h3><button type="button" class="x" data-close aria-label="Fechar">×</button></header>
      <form novalidate autocomplete="off"><div class="mbody"><div class="ferr" hidden></div>${html}</div>
      <footer>${extraFooter}${onSubmit ? `<button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" type="submit">${esc(submit)}</button>` : `<button type="button" class="btn ghost" data-close>Fechar</button>`}</footer>
      </form></div></div>`);
  const el = document.getElementById(id), form = el.querySelector('form');
  const close = () => el.remove();
  el.addEventListener('mousedown', e => { if (e.target === el) el._down = true; });
  el.addEventListener('click', e => {
    if (e.target.closest('[data-close]') || (e.target === el && el._down)) close();
    el._down = false;
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!onSubmit) return;
    const btn = form.querySelector('button[type=submit]');
    if (btn.disabled) return;           // evita duplo clique / duplicidade
    const errBox = form.querySelector('.ferr'); errBox.hidden = true;
    const fd = {}; new FormData(form).forEach((v,k) => { fd[k] = v; });
    btn.disabled = true; btn.textContent = 'Salvando…';
    try { const r = await onSubmit(fd, form); if (r !== false) close(); }
    catch(err){ errBox.textContent = err.message || String(err); errBox.hidden = false; errBox.scrollIntoView({block:'nearest'}); }
    finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = submit; } }
  });
  if (onInit) onInit(form, el, close);
  const first = form.querySelector('input:not([type=hidden]):not([readonly]),select,textarea');
  if (first && window.innerWidth > 860) first.focus();
  return { el, form, close };
}
function confirmar(msg, ok='Confirmar', perigo=true){
  return new Promise(res => {
    let resolved = false;
    const m = modal({ title:'Confirmação', html:`<p style="margin:0;line-height:1.5">${msg}</p>`, submit:ok,
      onSubmit: async () => { resolved = true; res(true); } });
    if (perigo) m.form.querySelector('button[type=submit]').className = 'btn danger';
    new MutationObserver((_, obs) => { if (!document.body.contains(m.el)) { obs.disconnect(); if (!resolved) res(false); } })
      .observe($('#modal-root'), { childList:true });
  });
}
function toast(msg, err=false){
  const t = document.createElement('div'); t.className = 'toast'+(err?' err':''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600);
}

/* ---------- Exportação ---------- */
async function salvarArquivo(nome, data){
  if (!S.downloads) { toast('Download indisponível nesta visualização.', true); return; }
  try { await S.downloads.save({ filename:nome, data }); toast('Arquivo pronto.'); }
  catch(e){ if (e && e.code === 'declined') return; toast('Não foi possível baixar: '+(e.message||e.code), true); }
}
async function exportarXLSX(nome, titulo, cab, linhas){
  if (!window.XLSX) {
    const csv = [cab, ...linhas].map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
    return salvarArquivo(nome.replace(/\.xlsx$/,'.csv'), '﻿'+csv);
  }
  const aoa = [['ESTÂNCIA 78 – GESTÃO RURAL'], [titulo], ['Gerado em '+D(hoje())+' · Dados. Manejo. Resultado.'], [], cab, ...linhas];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = cab.map((c,i) => ({ wch: Math.min(40, Math.max(10, String(c).length+2, ...linhas.slice(0,200).map(l => String(l[i]??'').length+1))) }));
  ws['!merges'] = [{s:{r:0,c:0},e:{r:0,c:Math.max(0,cab.length-1)}},{s:{r:1,c:0},e:{r:1,c:Math.max(0,cab.length-1)}}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, titulo.slice(0,31).replace(/[\\/?*[\]:]/g,''));
  const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  return salvarArquivo(nome, new Blob([buf]));
}

function periodo(prefix){ return [uiGet(prefix+'Ini', mesIni()), uiGet(prefix+'Fim', mesFim())]; }
function vazio(t, s=''){ return `<div class="empty"><b>${t}</b>${s}</div>`; }
function badgeStatus(st){
  const m = { pago:['b-ok','Pago'], recebido:['b-ok','Recebido'], parcial:['b-par','Parcial'], pendente:['b-pend','Pendente'], vencido:['b-err','Vencido'] }[st] || ['b-mut',st];

function dotAtv(atv){ return `<span class="dot" style="background:${CORES[atv]||'#999'}"></span>${esc(ATIVIDADES[atv]||atv||'—')}`; }

/* =====================================================================
   Cálculos financeiros + módulo Financeiro
   ===================================================================== */
function pagoDe(l){ return round2(sum(l.pagamentos||[], p => p.valor)); }
function restante(l){ return round2((+l.valor||0) - pagoDe(l)); }
function statusL(l){
  const p = pagoDe(l), v = +l.valor||0;
  if (v > 0 && p >= v - 0.005) return l.tipo === 'receita' ? 'recebido' : 'pago';
  if (p > 0) return 'parcial';
  if ((l.vencimento || l.data) < hoje()) return 'vencido';
  return 'pendente';
}
const quitado = l => ['pago','recebido'].includes(statusL(l));
function saldoConta(c){
  let s = +c.saldoInicial || 0;
  for (const l of A('lancamentos')) for (const p of (l.pagamentos||[])) if (p.contaId === c.id) s += (l.tipo === 'receita' ? 1 : -1) * (+p.valor||0);
  return round2(s);
}
const saldoTotal = () => round2(sum(A('contas'), saldoConta));
// pagamentos efetivos (caixa) num período
function caixa(ini, fim, filtro=()=>true){
  let ent = 0, sai = 0;
  for (const l of A('lancamentos')) { if (!filtro(l)) continue;
    for (const p of (l.pagamentos||[])) if (inRange(p.data, ini, fim)) { if (l.tipo === 'receita') ent += +p.valor||0; else sai += +p.valor||0; } }
  return { ent:round2(ent), sai:round2(sai), liq:round2(ent-sai) };
}
// Resultado econômico (competência) — não mistura investimentos nem compras de animais
function econ(ini, fim, atv){
  const L = A('lancamentos').filter(l => inRange(l.data, ini, fim) && (!atv || l.atividade === atv));
  const rec = sum(L.filter(l => l.tipo==='receita'), l => l.valor);
  const cmv = sum(L.filter(l => l.tipo==='receita'), l => l.custoVendido);
  const D_ = L.filter(l => l.tipo==='despesa');
  const oper = sum(D_.filter(l => l.classificacao==='operacional'), l => l.valor);
  const ger  = sum(D_.filter(l => l.classificacao==='geral' || l.classificacao==='manutencao'), l => l.valor);
  const inv  = sum(D_.filter(l => CLASSIF_INV.includes(l.classificacao)), l => l.valor);
  const desp = oper + ger;
  return { rec:round2(rec), cmv:round2(cmv), oper:round2(oper), ger:round2(ger), inv:round2(inv), desp:round2(desp), res:round2(rec - cmv - oper - ger) };
}
function abertos(tipo){ return A('lancamentos').filter(l => l.tipo === tipo && !quitado(l)); }

function classifPadrao(atv, cat, grupo){
  if (atv === 'geral') {
    if (ITENS_MANUT.includes(cat)) return 'manutencao';
    if (ITENS_PATRIM.includes(cat)) return 'patrimonio';
    return (GRUPOS_GERAIS[grupo]||{}).classif || 'geral';
  }
  if (Object.values(COMPRA_CAT).includes(cat)) return 'patrimonio';
  return 'operacional';
}

/* ---------- Criação de lançamentos (usado por todos os módulos) ---------- */
// Cria um lançamento. pagoAgora: valor já pago/recebido na data, na conta informada.
async function criarLanc(d, { pagoAgora=0, dataPg, contaId, id } = {}){
  const lid = id || novoId('lancamentos');
  const pagamentos = pagoAgora > 0 ? [{ id:uid(), data:dataPg || d.data, valor:round2(pagoAgora), contaId:contaId || d.contaId || '' }] : [];
  const body = { tipo:d.tipo, data:d.data, atividade:d.atividade, categoria:d.categoria, classificacao: d.tipo==='despesa' ? (d.classificacao || classifPadrao(d.atividade, d.categoria, d.grupo)) : null,
    grupo:d.grupo||null, local:d.local||'', descricao:d.descricao||'', quantidade:d.quantidade||null, valorUnit:d.valorUnit||null,
    valor:round2(d.valor), forma:d.forma||'', contaId:d.contaId||'', vencimento:d.vencimento||d.data, contraparte:d.contraparte||'',
    comprovante:d.comprovante||'', obs:d.obs||'', origem:d.origem||'manual', refId:d.refId||null, custoVendido:d.custoVendido!=null?round2(d.custoVendido):null,
    grupoParcela:d.grupoParcela||null, parcela:d.parcela||null, pagamentos };
  await dbSet('lancamentos', lid, body);
  await audit('criar', 'lancamentos', lid, `${body.tipo} ${body.categoria} ${R(body.valor)}`);
  return lid;
}
function duplicado(d){
  return A('lancamentos').find(l => l.tipo === d.tipo && l.data === d.data && Math.abs((+l.valor||0) - d.valor) < 0.005 &&
    (l.descricao||'').trim().toLowerCase() === (d.descricao||'').trim().toLowerCase() && l.categoria === d.categoria);
}

/* ---------- Formulário de lançamento ---------- */
function abrirLancamento(preset = {}, edit = null){
  const L = edit || {};
  const tipo0 = L.tipo || preset.tipo || 'despesa';
  const atv0 = L.atividade || preset.atividade || 'bovinos';
  const auto = edit && edit.origem && edit.origem !== 'manual';
  const html = `
    ${auto ? `<div class="note" style="margin-bottom:12px">Lançamento gerado automaticamente por ${esc(edit.origem)}. Valor, tipo e atividade são definidos pela movimentação de origem — para alterar, estorne a movimentação.</div>` : ''}
    <div class="fg">
      <div class="fld full"><span>Tipo</span><div class="toggle">
        <label><input type="radio" name="tipo" value="receita" ${tipo0==='receita'?'checked':''} ${auto?'disabled':''}><span>Receita</span></label>
        <label><input type="radio" name="tipo" value="despesa" ${tipo0==='despesa'?'checked':''} ${auto?'disabled':''}><span>Despesa</span></label></div></div>
      ${fDate('data','Data', L.data || preset.data || hoje())}
      ${fSel('atividade','Atividade', Object.entries(ATIVIDADES), atv0, auto?'disabled':'')}
      <label class="fld" data-w="grupo"><span>Grupo (Despesas Gerais)</span><select name="grupo"></select></label>
      <label class="fld"><span>Categoria</span><select name="categoria"></select></label>
      <label class="fld" data-w="classif"><span>Classificação</span><select name="classificacao">${opts(Object.entries(CLASSIF), L.classificacao)}</select></label>
      <label class="fld" data-w="local"><span>Estrutura / local beneficiado</span><input name="local" list="dl-locais" value="${esc(L.local||'')}" placeholder="Ex.: Pasto 2, Casa sede"></label>
      ${fInp('descricao','Descrição', L.descricao||preset.descricao||'', 'full')}
      ${fNum('quantidade','Quantidade', L.quantidade||'')}
      ${fNum('valorUnit','Valor unitário (R$)', L.valorUnit||'')}
      ${fNum('valor','Valor total (R$)', L.valor||'', auto?'readonly':'')}
      ${fSel('forma','Forma de pagamento', FORMAS, L.forma||'PIX')}
      ${fSel('contaId','Conta financeira', contaOpts(), L.contaId||contaPadrao())}
      ${fDate('vencimento','Vencimento', L.vencimento || L.data || hoje())}
      ${fInp('contraparte','Fornecedor / cliente', L.contraparte||'')}
      ${edit ? '' : fSel('situacao','Situação', [['quitado','Pago / recebido'],['pendente','Pendente (a pagar / receber)']], preset.situacao||'quitado')}
      ${edit ? '' : `<label class="fld"><span>Parcelas</span><input name="parcelas" inputmode="numeric" value="1"></label>
        <label class="fld"><span>Repetir mensalmente (meses)</span><input name="recorrente" inputmode="numeric" value="1"></label>`}
      ${fInp('comprovante','Comprovante (nº da nota, recibo ou link)', L.comprovante||'', 'full')}
      ${fTxt('obs','Observações', L.obs||'')}
    </div>
    <datalist id="dl-locais">${[...new Set([...(S.cfg.locais||[]), ...A('lancamentos').map(l=>l.local).filter(Boolean)])].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <p class="small muted" style="margin:10px 0 0">Parcelas dividem o valor total em vencimentos mensais. Repetição cria o mesmo lançamento nos meses seguintes (ex.: energia).</p>`;
  modal({ title: edit ? 'Editar lançamento' : 'Novo lançamento', html, submit: edit ? 'Salvar alterações' : 'Lançar',
    onInit(form){
      const f = n => form.elements[n];
      const tipoAtual = () => auto ? edit.tipo : (form.querySelector('[name=tipo]:checked')||{}).value;
      const atvAtual = () => auto ? edit.atividade : f('atividade').value;
      function refresh(keepCat){
        const tipo = tipoAtual(), atv = atvAtual();
        const geral = atv === 'geral' && tipo === 'despesa';
        form.querySelector('[data-w=grupo]').style.display = geral ? '' : 'none';
        form.querySelector('[data-w=classif]').style.display = tipo === 'despesa' ? '' : 'none';
        form.querySelector('[data-w=local]').style.display = tipo === 'despesa' ? '' : 'none';
        let cats;
        if (tipo === 'receita') cats = catsReceita(atv);
        else if (geral) {
          if (!f('grupo').options.length) f('grupo').innerHTML = opts(Object.entries(GRUPOS_GERAIS).map(([k,g])=>[k,g.nome]), L.grupo || preset.grupo || 'gerais');
          cats = [...GRUPOS_GERAIS[f('grupo').value].itens, ...(S.cfg.catDespesaExtra||[])];
        } else cats = catsDespesa(atv);
        const cur = keepCat ? f('categoria').value : (L.categoria || preset.categoria);
        if (cur && !cats.includes(cur)) cats = [cur, ...cats];
        f('categoria').innerHTML = opts(cats, cur);
        if (!keepCat && !L.classificacao) f('classificacao').value = classifPadrao(atv, f('categoria').value, f('grupo').value);
      }
      refresh(false);
      form.addEventListener('change', e => {
        const n = e.target.name;
        if (n === 'tipo' || n === 'atividade') { f('grupo').innerHTML=''; refresh(false); f('classificacao').value = classifPadrao(atvAtual(), f('categoria').value, f('grupo').value); }
        if (n === 'grupo') { refresh(false); f('classificacao').value = classifPadrao(atvAtual(), f('categoria').value, f('grupo').value); }
        if (n === 'categoria') f('classificacao').value = classifPadrao(atvAtual(), f('categoria').value, f('grupo').value);
        if (n === 'data' && !edit) f('vencimento').value = f('data').value;
      });
      form.addEventListener('input', e => {
        if ((e.target.name === 'quantidade' || e.target.name === 'valorUnit') && !auto) {
          const q = num(f('quantidade').value), u = num(f('valorUnit').value);
          if (q > 0 && u > 0) f('valor').value = numStr(q*u);
        }
      });
    },
    async onSubmit(fd){
      exigeEscrita();
      const tipo = auto ? edit.tipo : fd.tipo, atividade = auto ? edit.atividade : fd.atividade;
      const d = {
        tipo, atividade, data:reqData(fd.data), categoria:reqTxt(fd.categoria,'a categoria'),
        classificacao: tipo === 'despesa' ? fd.classificacao : null,
        grupo: (tipo === 'despesa' && atividade === 'geral') ? fd.grupo : null,
        local: tipo === 'despesa' ? (fd.local||'').trim() : '',
        descricao:(fd.descricao||'').trim(), quantidade:num(fd.quantidade)||null, valorUnit:num(fd.valorUnit)||null,
        valor: auto ? edit.valor : reqPos(fd.valor,'o valor total'), forma:fd.forma, contaId:fd.contaId,
        vencimento: fd.vencimento || fd.data, contraparte:(fd.contraparte||'').trim(), comprovante:(fd.comprovante||'').trim(), obs:(fd.obs||'').trim()
      };
      if (!d.descricao) d.descricao = d.categoria;
      if (edit) {
        if (!auto && d.valor < pagoDe(edit) - 0.005) throw new Error(`O valor não pode ser menor que o já pago (${R(pagoDe(edit))}).`);
        await dbUpd('lancamentos', edit.id, d);
        await audit('editar', 'lancamentos', edit.id, `${d.categoria} ${R(d.valor)}`);
        toast('Lançamento atualizado.'); return;
      }
      const quit = fd.situacao === 'quitado';
      if (quit && !d.contaId) throw new Error('Cadastre uma conta financeira (Financeiro › Contas) para registrar o pagamento.');
      const nParc = Math.max(1, Math.min(120, parseInt(fd.parcelas)||1));
      const nRec  = Math.max(1, Math.min(60, parseInt(fd.recorrente)||1));
      if (nParc > 1 && nRec > 1) throw new Error('Use parcelas OU repetição mensal, não os dois ao mesmo tempo.');
      const dup = duplicado(d);
      if (dup && !(await confirmar(`Já existe um lançamento igual em ${D(dup.data)} (${esc(dup.descricao)} · ${R(dup.valor)}). Lançar mesmo assim?`, 'Lançar mesmo assim', false))) return false;
      if (nParc > 1) {
        const gp = uid(), base = Math.floor(d.valor / nParc * 100) / 100;
        for (let i = 0; i < nParc; i++) {
          const v = i === nParc-1 ? round2(d.valor - base*(nParc-1)) : base;
          const venc = addMeses(d.vencimento, i);
          await criarLanc({ ...d, valor:v, vencimento:venc, grupoParcela:gp, parcela:`${i+1}/${nParc}`, descricao:`${d.descricao} (${i+1}/${nParc})` },
            { pagoAgora: quit && i === 0 ? v : 0, contaId:d.contaId });
        }
        toast(`${nParc} parcelas lançadas.`);
      } else if (nRec > 1) {
        const gp = uid();
        for (let i = 0; i < nRec; i++) {
          const dt = addMeses(d.data, i);
          await criarLanc({ ...d, data:dt, vencimento:addMeses(d.vencimento, i), grupoParcela:gp, parcela:`rec ${i+1}/${nRec}` },
            { pagoAgora: quit && i === 0 ? d.valor : 0, contaId:d.contaId, dataPg:dt });
        }
        toast(`${nRec} lançamentos mensais criados.`);
      } else {
        await criarLanc(d, { pagoAgora: quit ? d.valor : 0, contaId:d.contaId });
        toast('Lançamento registrado.');
      }
    }
  });
}

function abrirPagamento(l){
  const rest = restante(l), rec = l.tipo === 'receita';
  const hist = (l.pagamentos||[]).map(p => `<tr><td>${D(p.data)}</td><td>${esc((byId('contas',p.contaId)||{}).nome||'—')}</td><td class="n">${R(p.valor)}</td><td class="n"><button type="button" class="ico" data-act="desfazPg" data-id="${l.id}" data-pg="${p.id}">desfazer</button></td></tr>`).join('');
  modal({ title: rec ? 'Registrar recebimento' : 'Registrar pagamento', submit: rec ? 'Receber' : 'Pagar',
    html: `<div class="dl"><div><span>Lançamento</span><b>${esc(l.descricao||l.categoria)}</b></div><div><span>Valor</span><b>${R(l.valor)}</b></div><div><span>Em aberto</span><b>${R(rest)}</b></div></div>
      ${hist ? `<div class="tw" style="margin-bottom:14px"><table><thead><tr><th>Data</th><th>Conta</th><th class="n">Valor</th><th></th></tr></thead><tbody>${hist}</tbody></table></div>` : ''}
      ${rest > 0 ? `<div class="fg">${fDate('data', 'Data')}${fNum('valor','Valor (R$)', rest)}${fSel('contaId','Conta', contaOpts(), l.contaId || contaPadrao())}${fSel('forma','Forma', FORMAS, l.forma||'PIX')}</div>
      <p class="small muted">Para pagamento parcial, informe um valor menor que o saldo em aberto.</p>` : '<div class="note">Lançamento quitado.</div>'}`,
    onSubmit: rest > 0 ? async fd => {
      exigeEscrita();
      const v = reqPos(fd.valor, 'o valor'); reqData(fd.data);
      if (!fd.contaId) throw new Error('Selecione a conta.');
      if (v > rest + 0.005) throw new Error(`Valor maior que o saldo em aberto (${R(rest)}).`);
      const pgs = [ ...(l.pagamentos||[]), { id:uid(), data:fd.data, valor:round2(v), contaId:fd.contaId } ];
      await dbUpd('lancamentos', l.id, { pagamentos:pgs, forma:fd.forma });
      await audit(rec ? 'receber' : 'pagar', 'lancamentos', l.id, R(v));
      toast(rec ? 'Recebimento registrado.' : 'Pagamento registrado.');
    } : null });
}

async function excluirLanc(l){
  if (l.origem && l.origem !== 'manual') { toast('Lançamento automático: estorne a movimentação de origem (venda/compra) no módulo do animal.', true); return; }
  const irmaos = l.grupoParcela ? A('lancamentos').filter(x => x.grupoParcela === l.grupoParcela && x.id !== l.id && !pagoDe(x)) : [];
  const ok = await confirmar(`Excluir o lançamento <b>${esc(l.descricao||l.categoria)}</b> de ${R(l.valor)}? O registro fica guardado na auditoria (exclusão lógica).` +
    (irmaos.length ? `<br><br>Existem ${irmaos.length} outras parcelas/repetições em aberto deste grupo — elas também serão excluídas.` : ''), 'Excluir');
  if (!ok) return;
  try {
    exigeEscrita();
    for (const x of [l, ...irmaos]) {
      await dbUpd('lancamentos', x.id, { excluido:true, excluidoEm:stamp() });
      await audit('excluir', 'lancamentos', x.id, `${x.categoria} ${R(x.valor)}`);
    }
    toast('Lançamento excluído.');
  } catch(e){ falha(e); }
}

/* ---------- Página Financeiro ---------- */
function filtraLancs(prefix){
  const [ini, fim] = periodo(prefix);
  const tipo = uiGet(prefix+'Tipo',''), atv = uiGet(prefix+'Atv',''), cat = uiGet(prefix+'Cat',''), st = uiGet(prefix+'St',''), q = (uiGet(prefix+'Q','')||'').toLowerCase();
  return A('lancamentos').filter(l => inRange(l.data, ini, fim) && (!tipo || l.tipo === tipo) && (!atv || l.atividade === atv) && (!cat || l.categoria === cat) &&
    (!st || statusL(l) === st || (st === 'aberto' && !quitado(l))) && (!q || `${l.descricao} ${l.contraparte} ${l.categoria} ${l.local}`.toLowerCase().includes(q)))
    .sort((a,b) => (b.data||'').localeCompare(a.data||'') || (b.criadoEm||'').localeCompare(a.criadoEm||''));
}
function tabelaLancs(L, { acoes=true, venc=false } = {}){
  if (!L.length) return `<div class="tw">${vazio('Nenhum lançamento encontrado', 'Ajuste os filtros ou registre um novo lançamento.')}</div>`;
  const tr = L.slice(0, 500).map(l => `<tr>
      <td>${D(venc ? l.vencimento : l.data)}</td>
      <td><span class="badge ${l.tipo==='receita'?'b-ok':'b-err'}">${l.tipo==='receita'?'Receita':'Despesa'}</span></td>
      <td>${dotAtv(l.atividade)}</td>
      <td>${esc(l.categoria)}${l.classificacao && l.classificacao!=='operacional' ? `<div class="small muted">${esc(CLASSIF[l.classificacao])}</div>` : ''}</td>
      <td>${esc(l.descricao)}${l.contraparte?`<div class="small muted">${esc(l.contraparte)}</div>`:''}</td>

      ${kpi('Saldo disponível', R(saldoTotal()), A('contas').length+' conta(s)', 'gold')}
      ${kpi('Contas a pagar', R(ap), abertos('despesa').length+' em aberto', 'red')}
      ${kpi('Contas a receber', R(ar), abertos('receita').length+' em aberto', 'green')}

    <div class="bar"><button class="btn primary" data-act="novoLanc">+ Novo lançamento</button>

function abrirConta(c = null){
  modal({ title: c ? 'Editar conta' : 'Nova conta financeira',

      <label class="fld full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="padrao" ${c?.padrao||!A('contas').length?'checked':''} style="width:auto"> Conta padrão nos lançamentos</label></div>`,
    async onSubmit(fd){
      exigeEscrita();
      const d = { nome:reqTxt(fd.nome,'o nome'), tipoConta:fd.tipoConta, saldoInicial:num(fd.saldoInicial), padrao:!!fd.padrao };
      if (A('contas').some(x => x.nome.toLowerCase() === d.nome.toLowerCase() && x.id !== c?.id)) throw new Error('Já existe uma conta com esse nome.');
      if (d.padrao) for (const x of A('contas').filter(x => x.padrao && x.id !== c?.id)) await dbUpd('contas', x.id, { padrao:false });
      if (c) { await dbUpd('contas', c.id, d); await audit('editar','contas',c.id,d.nome); }
      else { const id = novoId('contas'); await dbSet('contas', id, d); await audit('criar','contas',id,d.nome); }
      toast('Conta salva.');
    } });
}

/* =====================================================================
   Animais: cadastro individual, lotes, movimentações, vendas, ovos
   Regra: saldo de lote = soma dos deltas das movimentações válidas;
          animal individual ativo = situacao 'ativo'.
   ===================================================================== */
const movsValidas = () => A('movimentacoes');
function saldoLote(id){
  let s = 0;
  for (const m of movsValidas()) { if (m.loteId === id) s += +m.delta||0; if (m.paraLoteId === id) s += +m.qtdTransf||0; }
  return s;
}
function custoMedioLote(id){
  let ent = 0, custo = 0;
  for (const m of movsValidas()) {
    if (m.loteId === id && (+m.delta||0) > 0) { ent += +m.delta; if (m.tipo === 'compra') custo += +m.valor||0; }
    if (m.paraLoteId === id) { ent += +m.qtdTransf||0; custo += +m.custoTransf||0; }
  }
  return ent ? custo / ent : 0;
}
const indAtivos = esp => A('animais').filter(a => a.especie === esp && a.situacao === 'ativo');
const lotesAtivos = esp => A('lotes').filter(l => l.especie === esp && l.situacao !== 'encerrado');
const cabecas = esp => indAtivos(esp).length + sum(lotesAtivos(esp), l => Math.max(0, saldoLote(l.id)));
const nomeLote = l => l ? `${l.codigo}${l.categoria?' · '+l.categoria:''}` : '—';
const nomeAnimal = a => a ? `${a.ident}${a.nome?' – '+a.nome:''}` : '—';
function movsDoAnimal(id){ return movsValidas().filter(m => (m.animalIds||[]).includes(id)).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.criadoEm||'').localeCompare(a.criadoEm||'')); }
function movsDoLote(id){ return movsValidas().filter(m => m.loteId === id || m.paraLoteId === id).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.criadoEm||'').localeCompare(a.criadoEm||'')); }
const LOCAL_LBL = { bovino:'Lote / pastagem', suino:'Baia / localização', galinha:'Galinheiro' };

async function criarMov(d, id){
  const mid = id || novoId('movimentacoes');
  await dbSet('movimentacoes', mid, d);
  await audit('movimentar', 'movimentacoes', mid, `${MOV_NOMES[d.tipo]||d.tipo} ${ESPECIES[d.especie]?.sing||''} x${d.qtd||''}`);
  return mid;
}

/* Bloco de pagamento reutilizável (compras e vendas) */
function blocoPagamento(tipo, pfx=''){
  const rec = tipo === 'receita';
  return `<div class="fg" style="margin-top:12px">
    ${fSel(pfx+'situacao', rec ? 'Situação do recebimento' : 'Situação do pagamento', rec ? [['quitado','Recebido'],['parcial','Recebido parcialmente'],['pendente','A receber']] : [['quitado','Pago'],['parcial','Pago parcialmente'],['pendente','A pagar']], 'quitado')}
    ${fNum(pfx+'valorParcial', rec ? 'Valor recebido agora (R$)' : 'Valor pago agora (R$)', '', '')}

    ${fSel(pfx+'contaId','Conta financeira', contaOpts(), contaPadrao())}
    ${fDate(pfx+'vencimento','Vencimento')}
  </div>`;
}
function wirePagamento(form, pfx=''){
  const sit = form.elements[pfx+'situacao'], parc = form.elements[pfx+'valorParcial'];
  const upd = () => { parc.closest('.fld').style.display = sit.value === 'parcial' ? '' : 'none'; };
  sit.addEventListener('change', upd); upd();
}
function pagoAgoraDe(fd, total, pfx=''){
  const s = fd[pfx+'situacao'];
  if (s === 'quitado') return total;
  if (s === 'parcial') { const v = reqPos(fd[pfx+'valorParcial'], 'o valor pago/recebido agora'); if (v >= total) throw new Error('Valor parcial deve ser menor que o total.'); return v; }
  return 0;
}
function checaConta(fd, pago, pfx=''){ if (pago > 0 && !fd[pfx+'contaId']) throw new Error('Cadastre uma conta financeira em Financeiro › Contas.'); }

function situacaoBadge(s){ const m = { ativo:['b-ok','Ativo'], vendido:['b-par','Vendido'], morto:['b-err','Morto'], baixado:['b-mut','Baixado'] }[s] || ['b-mut',s]; return `<span class="badge ${m[0]}">${m[1]}</span>`; }

function abrirPesagem(id){

    <p class="small muted">Peso anterior: ${a.pesoAtual?N(a.pesoAtual,1)+' kg em '+D(a.dataPeso||a.dataEntrada):'não informado'}. O ganho médio diário (GMD) é calculado automaticamente.</p>`,

      const ant = a.pesoAtual || null, dAnt = a.dataPeso || a.dataEntrada;
      const dias = ant && dAnt ? diasEntre(dAnt, data) : 0;
      const gmd = dias > 0 ? round2((peso-ant)/dias*1000)/1000 : null;
      await criarMov({ especie:a.especie, tipo:'pesagem', data, animalIds:[id], qtd:1, peso, pesoAnterior:ant, dataAnterior:dAnt||null, gmd, obs:(fd.obs||'').trim() });
      if (!a.dataPeso || data >= a.dataPeso) await dbUpd('animais', id, { pesoAtual:peso, dataPeso:data });
      toast(gmd!=null ? `Pesagem registrada · GMD ${N(gmd,3)} kg/dia` : 'Pesagem registrada.');

}

function abrirMovInd(id, tipo){
  const a = byId('animais', id), esp = a.especie;
  const T = { mortalidade:'Registrar mortalidade', saida:'Saída / descarte / ajuste', transferencia:`Transferir ${LOCAL_LBL[esp].toLowerCase()}`, categoria:'Mudança de categoria' }[tipo];
  let campos = '';
  if (tipo === 'mortalidade') campos = fInp('causa','Causa provável','', 'full');
  if (tipo === 'saida') campos = fSel('subtipo','Tipo', [['descarte','Descarte'],['saida','Saída (doação, consumo próprio, perda)'],['ajuste','Ajuste de inventário (animal não encontrado)']], 'descarte', 'full');
  if (tipo === 'transferencia') campos = `<div class="fld"><span>Atual</span><input readonly value="${esc(a.local||'—')}"></div>${fInp('para','Novo '+LOCAL_LBL[esp].toLowerCase(),'','list="dl-loc2"')}<datalist id="dl-loc2">${[...new Set(A('animais').filter(x=>x.especie===esp).map(x=>x.local).filter(Boolean))].map(r=>`<option value="${esc(r)}">`).join('')}</datalist>`;
  if (tipo === 'categoria') campos = `<div class="fld"><span>Atual</span><input readonly value="${esc(a.categoria)}"></div>${fSel('para','Nova categoria', catsAnimal(esp), a.categoria)}`;

    ${['mortalidade','saida'].includes(tipo) ? '<p class="small muted">O animal sai do saldo ativo. Não gera lançamento financeiro.</p>' : '<p class="small muted">Movimentação interna: não gera lançamento financeiro.</p>'}`,
    submit:'Registrar',
    async onSubmit(fd){
      exigeEscrita(); const data = reqData(fd.data); const obs = (fd.obs||'').trim();
      if (tipo === 'mortalidade') {
        await criarMov({ especie:esp, tipo:'mortalidade', data, animalIds:[id], qtd:1, causa:(fd.causa||'').trim(), obs });
        await dbUpd('animais', id, { situacao:'morto', dataSaida:data });
      } else if (tipo === 'saida') {
        await criarMov({ especie:esp, tipo:fd.subtipo, data, animalIds:[id], qtd:1, obs });
        await dbUpd('animais', id, { situacao:'baixado', dataSaida:data });
      } else if (tipo === 'transferencia') {
        const para = reqTxt(fd.para, 'o destino');
        await criarMov({ especie:esp, tipo:'transferencia', data, animalIds:[id], qtd:1, de:a.local||'', para, obs });
        await dbUpd('animais', id, { local:para });
      } else if (tipo === 'categoria') {
        if (fd.para === a.categoria) throw new Error('Escolha uma categoria diferente da atual.');
        await criarMov({ especie:esp, tipo:'categoria', data, animalIds:[id], qtd:1, de:a.categoria, para:fd.para, obs });
        await dbUpd('animais', id, { categoria:fd.para });
      }
      toast('Movimentação registrada.');
      $$('#modal-root .mback').forEach(m => m.remove()); abrirFicha(id);
    } });
}

/* ---------- Lotes (suínos e galinhas) ---------- */
function abrirLote(esp, edit = null){
  const l = edit || {}, novo = !edit;
  const html = `<div class="fg">
    ${fInp('codigo','Identificação do lote *', l.codigo || proximoCodigo(esp))}
    ${fSel('categoria', esp==='galinha' ? 'Tipo de criação' : 'Categoria', catsAnimal(esp), l.categoria || (esp==='galinha'?'Caipira':'Leitão lactente'))}
    ${fInp('raca', esp==='galinha'?'Raça ou linhagem':'Raça', l.raca||'')}
    ${fDate('nascimento','Data de nascimento (aprox.)', l.nascimento||'')}
    ${fInp('local', LOCAL_LBL[esp], l.local||'')}
    ${fNum('pesoMedio','Peso médio inicial (kg)', l.pesoMedio||'')}
    ${novo ? `${fNum('qtd','Quantidade inicial *','')}
      ${fSel('origem','Origem', [['compra','Compra'],['nascimento','Nascimento na propriedade'],['entrada','Inventário inicial / já existente']], 'compra')}
      ${fDate('dataEntrada','Data de entrada')}
      ${fNum('valorAquisicao','Valor total de aquisição (R$)','')}
      ${fInp('fornecedor','Fornecedor / origem','')}
      ${esp==='suino' ? fInp('matriz','Matriz (leitegada)','', 'list="dl-matrizes"') : ''}` :
      `<div class="fld full note">Entrada: ${esc(MOV_NOMES[l.origem]||l.origem)} de ${N(l.qtdInicial)} cabeças em ${D(l.dataEntrada)}${l.valorAquisicao?' · '+R(l.valorAquisicao):''}.</div>`}
    ${fTxt('obs','Observações', l.obs||'')}
  </div>${novo ? `<div data-w="pg">${blocoPagamento('despesa')}</div>` : ''}
  <datalist id="dl-matrizes">${indAtivos('suino').filter(x=>x.sexo==='Fêmea').map(x=>`<option value="${esc(x.ident)}">`).join('')}</datalist>`;
  modal({ title: novo ? `Novo lote de ${ESPECIES[esp].nome.toLowerCase()}` : 'Editar lote', html, submit: novo ? 'Cadastrar lote' : 'Salvar',
    onInit(form){
      if (!novo) return; wirePagamento(form);
      const upd = () => { const c = form.elements.origem.value === 'compra';
        form.querySelector('[data-w=pg]').style.display = c ? '' : 'none'; form.elements.valorAquisicao.closest('.fld').style.display = c ? '' : 'none'; };
      form.elements.origem.addEventListener('change', upd); upd();
    },
    async onSubmit(fd){
      exigeEscrita();
      const d = { especie:esp, codigo:reqTxt(fd.codigo,'a identificação do lote'), categoria:fd.categoria, raca:(fd.raca||'').trim(), nascimento:fd.nascimento||'', local:(fd.local||'').trim(), pesoMedio:num(fd.pesoMedio)||null, obs:(fd.obs||'').trim() };
      if (A('lotes').some(x => x.especie === esp && x.codigo.toLowerCase() === d.codigo.toLowerCase() && x.id !== l.id)) throw new Error('Já existe um lote com essa identificação.');
      if (!novo) { await dbUpd('lotes', l.id, d); await audit('editar','lotes',l.id,d.codigo); toast('Lote atualizado.'); return; }
      const qtd = Math.round(reqPos(fd.qtd, 'a quantidade inicial'));
      const origem = fd.origem, data = reqData(fd.dataEntrada, 'a data de entrada');
      const valor = origem === 'compra' ? num(fd.valorAquisicao) : 0;
      const pago = valor > 0 ? pagoAgoraDe(fd, valor) : 0; checaConta(fd, pago);
      const loteId = novoId('lotes'), mid = novoId('movimentacoes'), lid = valor > 0 ? novoId('lancamentos') : null;
      await dbSet('lotes', loteId, { ...d, qtdInicial:qtd, origem, dataEntrada:data, valorAquisicao:valor||null, fornecedor:(fd.fornecedor||'').trim(), matriz:(fd.matriz||'').trim(), situacao:'ativo' });
      await criarMov({ especie:esp, tipo:origem, data, loteId, delta:qtd, qtd, valor:valor||null, contraparte:(fd.fornecedor||'').trim(), lancamentoId:lid, cadastro:true, obs:'Formação do lote '+d.codigo }, mid);
      if (lid) await criarLanc({ tipo:'despesa', data, atividade:ESPECIES[esp].atividade, categoria:COMPRA_CAT[ESPECIES[esp].atividade], classificacao:'patrimonio',
        descricao:`Compra lote ${d.codigo} (${qtd} cab.)`, quantidade:qtd, valorUnit:round2(valor/qtd), valor, forma:fd.forma, contaId:fd.contaId, vencimento:fd.vencimento||data,
        contraparte:(fd.fornecedor||'').trim(), origem:'compra', refId:mid }, { id:lid, pagoAgora:pago, contaId:fd.contaId });
      toast(`Lote ${d.codigo} cadastrado com ${qtd} cabeças.`);
    } });
}
function proximoCodigo(esp){ const p = esp==='galinha'?'GAL':'SUI'; const n = A('lotes').filter(l=>l.especie===esp).length + 1; return `${p}-${String(n).padStart(3,'0')}`; }

const MOV_LOTE = {
  nascimento:{ t:'Nascimento', sinal:+1 }, compra:{ t:'Compra de animais', sinal:+1 }, mortalidade:{ t:'Mortalidade', sinal:-1 },
  descarte:{ t:'Descarte', sinal:-1 }, ajuste:{ t:'Ajuste de quantidade', sinal:0 }, transferencia:{ t:'Transferência para outro lote', sinal:-1 },
  local:{ t:'Transferência de local', sinal:0 }, categoria:{ t:'Mudança de categoria', sinal:0 }, desmame:{ t:'Desmame', sinal:0 }
};
function abrirMovLote(loteId, tipo){
  const l = byId('lotes', loteId), esp = l.especie, saldo = saldoLote(loteId), cfgT = MOV_LOTE[tipo];
  let campos = '';
  if (['nascimento','mortalidade','descarte','compra'].includes(tipo)) campos += fNum('qtd','Quantidade *','');
  if (tipo === 'mortalidade') campos += fInp('causa','Causa provável','');
  if (tipo === 'ajuste') campos += fSel('sentido','Ajuste', [['+','Acrescentar (+)'],['-','Retirar (−)']], '-') + fNum('qtd','Quantidade *','');
  if (tipo === 'compra') campos += fNum('valor','Valor total (R$)','') + fInp('fornecedor','Fornecedor','');
  if (tipo === 'transferencia') {
    const dest = A('lotes').filter(x => x.especie === esp && x.id !== loteId && x.situacao !== 'encerrado');
    campos += fNum('qtd','Quantidade *','') + `<label class="fld"><span>Lote de destino *</span><select name="para">${opts(dest.map(x=>[x.id, nomeLote(x)]), '', dest.length?'Selecione…':'Nenhum outro lote ativo')}</select></label>`;
  }
  if (tipo === 'local') campos += `<div class="fld"><span>Atual</span><input readonly value="${esc(l.local||'—')}"></div>` + fInp('para','Novo '+LOCAL_LBL[esp].toLowerCase(),'');
  if (tipo === 'categoria') campos += `<div class="fld"><span>Atual</span><input readonly value="${esc(l.categoria)}"></div>` + fSel('para','Nova categoria', catsAnimal(esp), l.categoria);
  if (tipo === 'desmame') campos += fNum('qtd','Quantidade desmamada *', saldo) + fNum('pesoMedio','Peso médio no desmame (kg)','');
  modal({ title:`${cfgT.t} · ${l.codigo}`, submit:'Registrar',
    html:`<div class="note" style="margin-bottom:12px">Saldo atual do lote: <b>${N(saldo)} cabeça(s)</b>.</div><div class="fg">${fDate('data','Data')}${campos}${fTxt('obs','Observações','')}</div>
      ${tipo==='compra' ? `<div data-w="pg">${blocoPagamento('despesa')}</div>` : ''}
      ${tipo==='desmame' ? '<p class="small muted">A categoria do lote passa para “Leitão desmamado”. Leitões não desmamados (mortes na maternidade) devem ser lançados como mortalidade.</p>' : ''}`,
    onInit(form){ if (tipo === 'compra') wirePagamento(form); },
    async onSubmit(fd){
      exigeEscrita(); const data = reqData(fd.data), obs = (fd.obs||'').trim();
      const base = { especie:esp, data, loteId, obs };
      if (['nascimento','mortalidade','descarte'].includes(tipo)) {
        const q = Math.round(reqPos(fd.qtd,'a quantidade'));
        if (cfgT.sinal < 0 && q > saldo) throw new Error(`Quantidade maior que o saldo do lote (${saldo}).`);
        await criarMov({ ...base, tipo, delta:cfgT.sinal*q, qtd:q, causa:(fd.causa||'').trim()||null });
      } else if (tipo === 'ajuste') {
        const q = Math.round(reqPos(fd.qtd,'a quantidade')); const s = fd.sentido === '+' ? 1 : -1;
        if (s < 0 && q > saldo) throw new Error(`Quantidade maior que o saldo do lote (${saldo}).`);
        if (!obs) throw new Error('Informe o motivo do ajuste nas observações.');
        await criarMov({ ...base, tipo:'ajuste', delta:s*q, qtd:q });
      } else if (tipo === 'compra') {
        const q = Math.round(reqPos(fd.qtd,'a quantidade')), valor = num(fd.valor);
        const pago = valor > 0 ? pagoAgoraDe(fd, valor) : 0; checaConta(fd, pago);
        const mid = novoId('movimentacoes'), lid = valor > 0 ? novoId('lancamentos') : null;
        await criarMov({ ...base, tipo:'compra', delta:q, qtd:q, valor:valor||null, contraparte:(fd.fornecedor||'').trim(), lancamentoId:lid }, mid);
        if (lid) await criarLanc({ tipo:'despesa', data, atividade:ESPECIES[esp].atividade, categoria:COMPRA_CAT[ESPECIES[esp].atividade], classificacao:'patrimonio',
          descricao:`Compra p/ lote ${l.codigo} (${q} cab.)`, quantidade:q, valorUnit:round2(valor/q), valor, forma:fd.forma, contaId:fd.contaId, vencimento:fd.vencimento||data,
          contraparte:(fd.fornecedor||'').trim(), origem:'compra', refId:mid }, { id:lid, pagoAgora:pago, contaId:fd.contaId });
      } else if (tipo === 'transferencia') {
        const q = Math.round(reqPos(fd.qtd,'a quantidade'));
        if (!fd.para) throw new Error('Selecione o lote de destino.');
        if (q > saldo) throw new Error(`Quantidade maior que o saldo do lote (${saldo}).`);
        const custo = round2(custoMedioLote(loteId) * q);
        await criarMov({ ...base, tipo:'transferencia', delta:-q, qtd:q, paraLoteId:fd.para, qtdTransf:q, custoTransf:custo });
      } else if (tipo === 'local') {
        const para = reqTxt(fd.para,'o novo local');
        await criarMov({ ...base, tipo:'local', delta:0, qtd:saldo, de:l.local||'', para });
        await dbUpd('lotes', loteId, { local:para });
      } else if (tipo === 'categoria') {
        if (fd.para === l.categoria) throw new Error('Escolha uma categoria diferente.');
        await criarMov({ ...base, tipo:'categoria', delta:0, qtd:saldo, de:l.categoria, para:fd.para });
        await dbUpd('lotes', loteId, { categoria:fd.para });
      } else if (tipo === 'desmame') {
        const q = Math.round(reqPos(fd.qtd,'a quantidade desmamada'));
        if (q > saldo) throw new Error(`Quantidade maior que o saldo do lote (${saldo}).`);
        await criarMov({ ...base, tipo:'desmame', delta:0, qtd:q, pesoMedio:num(fd.pesoMedio)||null, de:l.categoria, para:'Leitão desmamado' });
        await dbUpd('lotes', loteId, { categoria:'Leitão desmamado', pesoMedio:num(fd.pesoMedio)||l.pesoMedio||null, dataDesmame:data, qtdDesmamada:q });
      }
      toast('Movimentação registrada.');
    } });
}

function abrirFichaLote(id){
  const l = byId('lotes', id); if (!l) return;
  const esp = l.especie, saldo = saldoLote(id), movs = movsDoLote(id);
  const nasc = sum(movs.filter(m=>m.loteId===id && m.tipo==='nascimento'), m=>m.qtd) + (l.origem==='nascimento'?0:0);
  const mort = sum(movs.filter(m=>m.loteId===id && m.tipo==='mortalidade'), m=>m.qtd);
  const vend = sum(movs.filter(m=>m.loteId===id && m.tipo==='venda'), m=>m.qtd);
  const entr = sum(movs.filter(m=>m.loteId===id && (+m.delta||0)>0), m=>m.delta) + sum(movs.filter(m=>m.paraLoteId===id), m=>m.qtdTransf);
  const ativo = l.situacao !== 'encerrado';
  const btn = (t,lbl,cls='ghost') => `<button type="button" class="btn ${cls} sm" data-act="loteMov" data-id="${id}" data-tipo="${t}">${lbl}</button>`;
  const html = `<div class="dl">
    <div><span>Lote</span><b>${esc(l.codigo)}</b></div><div><span>${esp==='galinha'?'Tipo de criação':'Categoria'}</span><b>${esc(l.categoria)}</b></div><div><span>Saldo atual</span><b style="font-size:18px">${N(saldo)} cab.</b></div>
    <div><span>Raça / linhagem</span><b>${esc(l.raca||'—')}</b></div><div><span>${LOCAL_LBL[esp]}</span><b>${esc(l.local||'—')}</b></div><div><span>Idade</span><b>${idadeTxt(l.nascimento)}</b></div>
    <div><span>Entradas totais</span><b>${N(entr)}</b></div><div><span>Mortalidade</span><b>${N(mort)} ${entr?`<span class="muted small">(${N(mort/entr*100,1)}%)</span>`:''}</b></div><div><span>Vendidos</span><b>${N(vend)}</b></div>
    <div><span>Custo médio de aquisição</span><b>${custoMedioLote(id)?R(custoMedioLote(id))+'/cab.':'—'}</b></div>${l.matriz?`<div><span>Matriz</span><b>${esc(l.matriz)}</b></div>`:''}${l.qtdDesmamada?`<div><span>Desmame</span><b>${N(l.qtdDesmamada)} em ${D(l.dataDesmame)}${l.pesoMedio?' · '+N(l.pesoMedio,1)+' kg':''}</b></div>`:''}
  </div>
  <div class="btnrow"><button type="button" class="btn ghost sm" data-act="editLote" data-id="${id}">Editar</button>
    ${ativo ? `${btn('nascimento','Nascimento')}${btn('compra','Compra')}${btn('mortalidade','Mortalidade','danger')}${btn('descarte','Descarte','danger')}${btn('transferencia','Transferir p/ lote')}${btn('local','Mudar '+(esp==='galinha'?'galinheiro':'baia'))}${btn('categoria','Mudar categoria')}${esp==='suino'?btn('desmame','Desmame'):''}${btn('ajuste','Ajuste')}
    <button type="button" class="btn gold sm" data-act="vender" data-esp="${esp}" data-lote="${id}">Vender</button>
    ${saldo===0?`<button type="button" class="btn ghost sm" data-act="encerrarLote" data-id="${id}">Encerrar lote</button>`:''}` : `<span class="badge b-mut">Lote encerrado</span> <button type="button" class="btn ghost sm" data-act="reabrirLote" data-id="${id}">Reabrir</button>`}</div>
  <h4 style="font-size:16px;color:var(--verde);margin:6px 0 8px">Histórico do lote</h4>${tabelaMovs(movs, { compacta:true, loteRef:id })}`;
  modal({ title:`Lote ${l.codigo} · ${ESPECIES[esp].nome}`, html, wide:true });
}

  <div class="calc" style="margin-top:14px"><div><span>Receita total</span><b data-o="tot">R$ 0,00</b></div><div><span>Custo dos animais</span><b data-o="custo">R$ 0,00</b></div><div><span>Lucro / prejuízo</span><b data-o="luc">R$ 0,00</b></div><div><span>Disponível</span><b data-o="disp">—</b></div></div>
  <p class="small muted" style="margin:6px 0 0">Custo = valor de aquisição dos animais vendidos (custo de alimentação e manejo por cabeça entra no módulo Custos, Etapa 3).</p>
  ${blocoPagamento('receita')}
  ${fTxt('obs','Observações','')}`;
  modal({ title:`Venda de ${ESPECIES[esp].nome.toLowerCase()}`, html, wide:true, submit:'Registrar venda',
    onInit(form){
      wirePagamento(form);
      const f = n => form.elements[n];
      const st = () => {
        if (multi) { const ck = $$('input[name=animal]:checked', form); return { disp: inds.length, qtd: ck.length, custo: sum(ck, c => c.dataset.custo), peso: sum(ck, c => c.dataset.peso) }; }
        const v = f('origem').value; if (!v) return { disp:0, custo:0 };
        if (v.startsWith('L:')) { const id = v.slice(2); return { disp: saldoLote(id), custoUnit: custoMedioLote(id), lote: byId('lotes', id) }; }
        const a = byId('animais', v.slice(2)); return { disp:1, custoUnit:a.valorAquisicao||0, animal:a };
      };
      let ultimo = null;
      function recalc(src){
        const s = st(); const modo = f('modo').value;
        if (multi) { f('qtd').value = s.qtd || ''; if (src === 'animal' && s.peso) { f('pesoTotal').value = numStr(s.peso); } }
        else if (src === 'origem') {
          if (s.animal) { f('qtd').value = '1'; if (s.animal.pesoAtual) f('pesoTotal').value = numStr(s.animal.pesoAtual); f('idade').value = idadeTxt(s.animal.nascimento); const p = PRODUTOS_VENDA[esp].find(p => p[0].toLowerCase().includes((s.animal.categoria||'').split(' ')[0].toLowerCase())); if (p) f('produto').value = p[0]; }
          if (s.lote) { if (!num(f('qtd').value)) f('qtd').value = s.disp; if (s.lote.nascimento) f('idade').value = idadeTxt(s.lote.nascimento); const p = PRODUTOS_VENDA[esp].find(p => p[0] === s.lote.categoria); if (p) f('produto').value = p[0]; if (s.lote.pesoMedio && !num(f('pesoMedio').value)) f('pesoMedio').value = numStr(s.lote.pesoMedio); }
        }
        const q = num(f('qtd').value);
        const pesos = (f('pesosInd').value||'').split(';').map(num).filter(x => x > 0);
        if (src === 'pesosInd' && pesos.length) { f('pesoTotal').value = numStr(sum(pesos, x=>x)); if (!multi && !num(f('qtd').value)) f('qtd').value = pesos.length; }
        if (src === 'pesoMedio' && q) f('pesoTotal').value = numStr(num(f('pesoMedio').value) * q);
        else if (['pesoTotal','qtd','pesosInd','animal','origem'].includes(src) && q && num(f('pesoTotal').value)) f('pesoMedio').value = numStr(num(f('pesoTotal').value) / q);
        else if (src === 'qtd' && num(f('pesoMedio').value)) f('pesoTotal').value = numStr(num(f('pesoMedio').value) * num(f('qtd').value));
        const vc = num(f('valorCabeca').value), vk = num(f('valorKg').value), pt = num(f('pesoTotal').value);
        let tot = num(f('valorTotal').value);
        if (modo === 'cabeca' || modo === 'unidade') tot = round2(q * vc);
        else if (modo === 'kg') tot = round2(pt * vk);
        if (modo !== 'lote') f('valorTotal').value = numStr(tot);
        f('valorTotal').readOnly = modo !== 'lote';
        f('valorCabeca').closest('.fld').style.display = (modo === 'cabeca' || modo === 'unidade') ? '' : 'none';
        f('valorKg').closest('.fld').style.display = modo === 'kg' ? '' : 'none';
        const custo = multi ? s.custo : round2((s.custoUnit||0) * q);
        const o = k => form.querySelector(`[data-o=${k}]`);
        o('tot').textContent = R(tot); o('custo').textContent = R(custo);
        o('luc').textContent = R(tot - custo); o('luc').style.color = tot - custo < 0 ? '#ffb4a3' : '#c9f0d6';
        o('disp').textContent = s.disp != null ? N(s.disp)+' cab.' : '—';
        ultimo = { tot, custo, s };
      }
      form.addEventListener('input', e => recalc(e.target.name));
      form.addEventListener('change', e => recalc(e.target.name));
      form._ultimo = () => ultimo;
      recalc(multi ? 'animal' : 'origem');
    },
    async onSubmit(fd, form){
      exigeEscrita();
      const data = reqData(fd.data), modo = fd.modo, produto = reqTxt(fd.produto, 'o produto');
      let animalIds = [], loteId = null, disp, custo = 0, origemTxt = '';
      if (multi) {
        animalIds = $$('input[name=animal]:checked', form).map(c => c.value);
        if (!animalIds.length) throw new Error('Marque ao menos um animal.');
        custo = sum(animalIds, id => byId('animais', id).valorAquisicao);
        origemTxt = animalIds.map(id => byId('animais', id).ident).join(', ');
      } else {
        const o = fd.origem; if (!o) throw new Error('Selecione a origem da venda.');
        if (o.startsWith('L:')) { loteId = o.slice(2); disp = saldoLote(loteId); origemTxt = 'lote ' + byId('lotes', loteId).codigo; }
        else { const a = byId('animais', o.slice(2)); if (a.situacao !== 'ativo') throw new Error('Animal não está ativo.'); animalIds = [a.id]; disp = 1; custo = a.valorAquisicao || 0; origemTxt = a.ident; }
      }
      const q = multi ? animalIds.length : Math.round(reqPos(fd.qtd, 'a quantidade'));
      if (!multi && q > disp) throw new Error(`Venda superior à quantidade disponível (${disp}).`);
      if (loteId) custo = round2(custoMedioLote(loteId) * q);
      const pt = num(fd.pesoTotal), pm = num(fd.pesoMedio) || (pt && q ? pt/q : 0);
      const vc = num(fd.valorCabeca), vk = num(fd.valorKg);
      let total = modo === 'kg' ? round2(pt * vk) : (modo === 'lote' ? num(fd.valorTotal) : round2(q * vc));
      if (modo === 'kg' && !pt) throw new Error('Informe o peso total (ou peso médio) para venda por kg.');
      if (!(total > 0)) throw new Error('Informe os valores da venda.');
      const pago = pagoAgoraDe(fd, total); checaConta(fd, pago);
      const cat = (PRODUTOS_VENDA[esp].find(p => p[0] === produto) || [0, CAT_RECEITA[ESPECIES[esp].atividade][0]])[1];
      const mid = novoId('movimentacoes'), lid = novoId('lancamentos');
      const pesos = (fd.pesosInd||'').split(';').map(num).filter(x => x > 0);
      await criarMov({ especie:esp, tipo:'venda', data, loteId, animalIds, delta: loteId ? -q : 0, qtd:q, valor:total, peso:pt||null, lancamentoId:lid, contraparte:(fd.comprador||'').trim(), obs:(fd.obs||'').trim(),
        venda:{ produto, modo, idade:(fd.idade||'').trim(), pesoMedio:pm?round2(pm):null, pesoTotal:pt||null, pesosInd:pesos, valorCabeca:vc||null, valorKg:vk||null, custo:round2(custo), lucro:round2(total-custo) } }, mid);
      await criarLanc({ tipo:'receita', data, atividade:ESPECIES[esp].atividade, categoria:cat, descricao:`Venda ${produto} – ${q} cab. (${origemTxt})`, quantidade:q,
        valorUnit: modo==='kg' ? vk : round2(total/q), valor:total, forma:fd.forma, contaId:fd.contaId, vencimento:fd.vencimento||data, contraparte:(fd.comprador||'').trim(),
        origem:'venda', refId:mid, custoVendido:custo }, { id:lid, pagoAgora:pago, contaId:fd.contaId });
      for (const id of animalIds) await dbUpd('animais', id, { situacao:'vendido', dataSaida:data });
      toast(`Venda registrada: ${R(total)} · lucro ${R(total-custo)}`);
      $$('#modal-root .mback').forEach(m => m.remove());
    } });
}

/* ---------- Estorno de movimentação ---------- */
async function estornarMov(m){
  const lanc = m.lancamentoId ? byId('lancamentos', m.lancamentoId) : null;
  // validações
  if (m.loteId && (+m.delta||0) > 0 && saldoLote(m.loteId) - m.delta < 0) return toast('Estorno deixaria o lote com saldo negativo. Estorne primeiro as saídas posteriores.', true);
  if (m.paraLoteId && saldoLote(m.paraLoteId) - (m.qtdTransf||0) < 0) return toast('Estorno deixaria o lote de destino com saldo negativo.', true);
  if (m.cadastro && m.loteId && movsDoLote(m.loteId).some(x => x.id !== m.id)) return toast('Este é o registro de formação do lote. Estorne antes as demais movimentações do lote.', true);
  if (m.cadastro && (m.animalIds||[]).some(id => movsDoAnimal(id).some(x => x.id !== m.id))) return toast('Este é o cadastro de entrada do animal. Estorne antes as demais movimentações dele.', true);
  const ok = await confirmar(`Estornar <b>${esc(MOV_NOMES[m.tipo]||m.tipo)}</b> de ${D(m.data)}${m.valor?` (${R(m.valor)})`:''}?` +
    (lanc ? `<br><br>O lançamento financeiro vinculado também será excluído${pagoDe(lanc)?` — inclusive ${R(pagoDe(lanc))} já ${lanc.tipo==='receita'?'recebidos':'pagos'}`:''}.` : '') +
    (m.cadastro ? '<br><br>O cadastro do animal/lote também será removido.' : '') + '<br><br>O registro fica guardado na auditoria.', 'Estornar');
  if (!ok) return;
  try {
    exigeEscrita();
    await dbUpd('movimentacoes', m.id, { excluido:true, excluidoEm:stamp() });
    if (lanc) await dbUpd('lancamentos', lanc.id, { excluido:true, excluidoEm:stamp() });
    for (const id of (m.animalIds||[])) {
      const a = byId('animais', id); if (!a) continue;
      if (m.cadastro) await dbUpd('animais', id, { excluido:true, excluidoEm:stamp() });
      else if (['venda','mortalidade','saida','descarte','ajuste'].includes(m.tipo)) await dbUpd('animais', id, { situacao:'ativo', dataSaida:null });
      else if (m.tipo === 'transferencia' && a.local === m.para) await dbUpd('animais', id, { local:m.de||'' });
      else if (m.tipo === 'categoria' && a.categoria === m.para) await dbUpd('animais', id, { categoria:m.de });
      else if (m.tipo === 'pesagem' && a.pesoAtual === m.peso) await dbUpd('animais', id, { pesoAtual:m.pesoAnterior||null, dataPeso:m.pesoAnterior?m.dataAnterior:null });
    }
    if (m.loteId) {
      const l = byId('lotes', m.loteId);
      if (m.cadastro) await dbUpd('lotes', m.loteId, { excluido:true, excluidoEm:stamp() });
      else if (l && m.tipo === 'local' && l.local === m.para) await dbUpd('lotes', m.loteId, { local:m.de||'' });
      else if (l && (m.tipo === 'categoria' || m.tipo === 'desmame') && l.categoria === m.para) await dbUpd('lotes', m.loteId, { categoria:m.de });
      if (l && l.situacao === 'encerrado') await dbUpd('lotes', m.loteId, { situacao:'ativo' });
    }
    await audit('estornar', 'movimentacoes', m.id, `${MOV_NOMES[m.tipo]||m.tipo} ${m.valor?R(m.valor):''}`);
    toast('Movimentação estornada.');
    $$('#modal-root .mback').forEach(x => x.remove());
  } catch(e){ falha(e); }
}

/* ---------- Tabelas ---------- */
function descMov(m){
  const parts = [];
  if (m.tipo === 'venda' && m.venda) parts.push(`${esc(m.venda.produto)} · ${m.venda.modo==='kg'?N(m.peso||m.venda.pesoTotal,1)+' kg × '+R(m.venda.valorKg):m.venda.modo==='lote'?'valor fechado':R(m.venda.valorCabeca)+'/cab.'}`);
  if (m.de || m.para) parts.push(`${esc(m.de||'—')} → ${esc(m.para||'—')}`);
  if (m.paraLoteId) parts.push(`→ lote ${esc((byId('lotes',m.paraLoteId)||{}).codigo||'?')}`);
  if (m.tipo === 'pesagem') parts.push(`${N(m.peso,1)} kg${m.gmd!=null?` · GMD ${N(m.gmd,3)}`:''}`);
  if (m.tipo === 'desmame' && m.pesoMedio) parts.push(`peso médio ${N(m.pesoMedio,1)} kg`);
  if (m.causa) parts.push('Causa: '+esc(m.causa));
  if (m.contraparte) parts.push(esc(m.contraparte));
  if (m.obs) parts.push(`<span class="muted">${esc(m.obs)}</span>`);
  return parts.join(' · ');
}
function alvoMov(m, loteRef){
  if (m.loteId) { const l = byId('lotes', m.loteId); return (loteRef && m.paraLoteId === loteRef) ? `de ${esc(l?.codigo||'?')}` : `Lote ${esc(l?.codigo||'?')}`; }
  return (m.animalIds||[]).map(id => esc((byId('animais', id)||{}).ident || '?')).join(', ');
}
function qtdMov(m, loteRef){
  if (loteRef && m.paraLoteId === loteRef) return `<span class="pos">+${N(m.qtdTransf)}</span>`;
  if (m.loteId) { const d = +m.delta||0; return d > 0 ? `<span class="pos">+${N(d)}</span>` : d < 0 ? `<span class="neg">${N(d)}</span>` : N(m.qtd||0); }
  const neg = ['venda','mortalidade','saida','descarte','ajuste'].includes(m.tipo), pos = ['compra','nascimento','entrada'].includes(m.tipo);
  return pos ? `<span class="pos">+${N(m.qtd)}</span>` : neg ? `<span class="neg">−${N(m.qtd)}</span>` : N(m.qtd||1);
}
